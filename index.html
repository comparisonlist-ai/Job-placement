<!DOCTYPE html>
<html lang="en">
<head>

    <!-- ==========================================
         Students Homework AI
         Version 3.0
         Production Build
         ========================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        http-equiv="X-UA-Compatible"
        content="IE=edge">

    <title>
        Students Homework AI | Smart Homework Help for CBSE Classes 6–10
    </title>

    <meta
        name="description"
        content="Students Homework AI helps CBSE Classes 6–10 with Maths, Science, English, Hindi, Social Science and more using AI-powered homework assistance.">

    <meta
        name="keywords"
        content="CBSE, Homework AI, Students Homework AI, NCERT, AI Homework Help, Class 6, Class 7, Class 8, Class 9, Class 10">

    <meta
        name="author"
        content="Sibaram Dalabehera">

    <meta
        name="theme-color"
        content="#1565C0">

    <meta
        name="robots"
        content="index, follow">

    <!-- Open Graph -->

    <meta
        property="og:title"
        content="Students Homework AI">

    <meta
        property="og:description"
        content="Smart Homework Help for CBSE Classes 6–10">

    <meta
        property="og:type"
        content="website">

    <meta
        property="og:url"
        content="https://studentshomeworkai.in">

    <meta
        property="og:image"
        content="images/logo.png">

    <!-- Favicon -->

    <link
        rel="icon"
        href="images/favicon.png">

    <!-- Google Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Stylesheet -->

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>
        <!-- ==========================================
         APP CONTAINER
    =========================================== -->

    <div id="app">

        <!-- ======================================
             APP MESSAGE
        ======================================= -->

        <div id="appMessage" class="app-message"></div>

        <!-- ======================================
             HOME / REGISTRATION SCREEN
        ======================================= -->

        <section id="registration" class="screen">

            <!-- Sticky Header -->

            <header class="top-header">

                <div class="brand">

                    <img
                        src="images/logo.png"
                        alt="Students Homework AI"
                        class="logo">

                    <div>

                        <h1 class="brand-title">
                            Students Homework AI
                        </h1>

                        <p class="brand-subtitle">
                            Smart Homework Help
                        </p>

                    </div>

                </div>

            </header>

            <!-- Hero -->

            <div class="hero">

                <img
                    src="images/logo.png"
                    alt="Students Homework AI"
                    class="hero-logo">

                <h2>

                    Homework Help for
                    <br>

                    CBSE Classes 6–10

                </h2>

                <p>

                    Instant AI Answers • NCERT Friendly
                    <br>

                    7-Day FREE Trial

                </p>

            </div>

            <!-- Registration Card -->

            <div class="card registration-card">

                <h3>

                    Register & Start FREE Trial

                </h3>

                <input
                    id="name"
                    type="text"
                    placeholder="Student Name"
                    autocomplete="name">

                <input
                    id="mobile"
                    type="tel"
                    placeholder="10-digit Mobile Number"
                    maxlength="10"
                    inputmode="numeric">

                <input
                    id="email"
                    type="email"
                    placeholder="Email Address"
                    autocomplete="email">

                <button
                    class="primary-btn"
                    onclick="registerStudent()">

                    🚀 Register & Start
                    7-Day FREE Trial

                </button>

            </div>

            <!-- Returning Student -->

            <div class="login-card">

                <p>

                    Already Registered?

                </p>

                <button
                    class="secondary-btn"
                    onclick="initApp()">

                    Continue

                </button>

            </div>

            <!-- Language -->

            <div class="language-card">

                <h3>

                    Choose Language

                </h3>

                <div class="language-buttons">

                    <button
                        id="englishBtn"
                        class="language-btn active">

                        🇬🇧 English

                    </button>

                    <button
                        id="hindiBtn"
                        class="language-btn">

                        🇮🇳 हिन्दी

                    </button>

                </div>

            </div>

        </section>

        <!-- ======================================
             DASHBOARD
        ======================================= -->

        <section
            id="dashboard"
            class="screen hidden">
